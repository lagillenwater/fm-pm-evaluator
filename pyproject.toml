[project]
name = "fmharness"
version = "0.1.0.dev0"
description = "Foundation-model evaluation harness for patient-derived tumor organoid drug response"
authors = [{ name = "Lucas Gillenwater", email = "lucas.gillenwater@cuanschutz.edu" }]
license = { text = "BSD-2-Clause-Patent" }
readme = "README.md"
requires-python = ">=3.11"
# Every dependency here is imported by code in this repository. The rest arrive with the rung
# that first needs them, so a reviewer can tell what the project actually runs on from the
# manifest alone rather than from what it might run on later.
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pyright>=1.1.360",
    "pre-commit>=3.7",
    # for running each task's verify and summary notebooks (PROCESS §3's executable verification)
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmharness"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# One marker per pipeline step, so a task can run exactly the project-rule tests for the steps it
# touched: `pytest -m step_promote`. Each marker is registered alongside the test that uses it;
# the step a rule governs is recorded with that rule in docs/SPEC.md.
markers = [
    "step_promote: writing a result and its provenance record",
    "step_document: recording specs, state, and the reversals behind them",
    "step_build: assembling the split-half frame the measurement runs on",
    "step_split: dividing a condition's replicate plates into two groups",
    "step_select: choosing a condition's responder genes from its first group alone",
    "step_score: computing a reported statistic from a measurement",
    "step_decompose: splitting replicate noise into its between-plate and within-plate parts",
    "step_null: building the negative-control distribution a statistic is read against",
    "known_answer: plants a known answer and requires the real, shipped function to recover it",
]
